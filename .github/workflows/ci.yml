name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts lee DATABASE_URL; `prisma generate` no se conecta,
      # sólo necesita que la variable exista.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # El cliente de Prisma está en .gitignore (libs/shared/database/src/generated).
      - run: npx prisma generate

      - uses: nrwl/nx-set-shas@v4

      # Sin format:check: el repo no sigue .prettierrc y formatear todo inflaría
      # cada diff. Sin e2e: api-e2e necesita la API levantada contra una base real.
      - run: npx nx affected -t lint test typecheck build --exclude=api-e2e
