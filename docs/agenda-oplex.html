<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPLEX — Agenda</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-sidebar: #0d0d14;
    --card: #131320;
    --card-hover: #181828;
    --border: #23232f;
    --border-soft: #1b1b28;
    --text: #e8e8f0;
    --text-dim: #8a8a9a;
    --text-faint: #5a5a68;
    --violet: #6d5cf5;
    --violet-soft: #6d5cf526;
    --violet-dim: #8b7cf7;
    /* colores por tipo de evento */
    --ev-sale: #6d5cf5;      /* ventas / facturación */
    --ev-collect: #f5a623;   /* cobros / cartera */
    --ev-pay: #ef5a6f;       /* pagos / cxp */
    --ev-tax: #e0457b;       /* impuestos */
    --ev-prod: #22c58b;      /* producción */
    --ev-cash: #3bb0e0;      /* caja */
    --ev-custom: #8a8a9a;    /* propio */
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 224px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-soft);
    padding: 22px 14px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 10px 22px;
    font-weight: 700; font-size: 18px; letter-spacing: .5px;
  }
  .brand .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--violet), #4a3fd0);
    display: grid; place-items: center; font-size: 13px; font-weight: 800;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    color: var(--text-dim); cursor: pointer; font-weight: 500;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: #14141f; color: var(--text); }
  .nav-item.active { background: var(--violet-soft); color: var(--violet-dim); }
  .nav-item .ico { width: 18px; height: 18px; opacity: .9; flex-shrink: 0; }
  .nav-item .chev { margin-left: auto; opacity: .4; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 60px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; padding: 0 26px; gap: 16px;
  }
  .topbar .spacer { flex: 1; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--card); color: var(--text); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #4a3fd0, var(--violet));
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }

  .content { padding: 26px; max-width: 1500px; width: 100%; }

  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
  .page-head p { color: var(--text-dim); margin-top: 5px; font-size: 14px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav h2 { font-size: 17px; font-weight: 600; min-width: 160px; }
  .nav-arrow {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-dim); cursor: pointer;
    display: grid; place-items: center; font-size: 15px;
  }
  .nav-arrow:hover { background: var(--card-hover); color: var(--text); }
  .today-btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-dim); cursor: pointer;
    font-size: 13px; font-weight: 500;
  }
  .today-btn:hover { color: var(--text); }
  .view-switch {
    display: flex; background: var(--card); border: 1px solid var(--border);
    border-radius: 9px; padding: 3px; gap: 2px; margin-left: auto;
  }
  .view-switch button {
    padding: 6px 15px; border: none; background: transparent;
    color: var(--text-dim); border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500;
  }
  .view-switch button.active { background: var(--violet); color: #fff; }

  /* ---------- Filters (event legend / toggles) ---------- */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .filter-chip {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 12.5px;
    color: var(--text-dim); user-select: none; transition: all .12s;
  }
  .filter-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .filter-chip.off { opacity: .38; }
  .filter-chip:hover { border-color: #33333f; }

  /* ---------- Layout: calendar + side panel ---------- */
  .agenda-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .agenda-grid { grid-template-columns: 1fr; } }

  /* ---------- Calendar ---------- */
  .calendar {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .cal-dow {
    display: grid; grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .cal-dow div {
    padding: 12px 10px; font-size: 11.5px; font-weight: 600;
    color: var(--text-faint); letter-spacing: .4px; text-transform: uppercase;
  }
  .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-cell {
    min-height: 116px; border-right: 1px solid var(--border-soft);
    border-bottom: 1px solid var(--border-soft); padding: 8px;
    display: flex; flex-direction: column; gap: 4px; cursor: pointer;
    transition: background .1s; position: relative;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell:hover { background: #16161f; }
  .cal-cell.other { background: #0f0f18; }
  .cal-cell.other .daynum { color: var(--text-faint); opacity: .5; }
  .daynum {
    font-size: 13px; font-weight: 500; color: var(--text-dim);
    width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%;
  }
  .cal-cell.today .daynum { background: var(--violet); color: #fff; font-weight: 700; }
  .ev {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 7px; border-radius: 6px; font-size: 11.5px;
    background: var(--evbg); color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 2.5px solid var(--evc);
  }
  .ev .amt { margin-left: auto; color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .ev-more { font-size: 11px; color: var(--text-faint); padding-left: 7px; }

  /* ---------- Side panel ---------- */
  .side { display: flex; flex-direction: column; gap: 16px; }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
  }
  .panel h3 {
    font-size: 11px; font-weight: 700; letter-spacing: .6px;
    color: var(--text-faint); text-transform: uppercase; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel h3 .count {
    background: var(--violet-soft); color: var(--violet-dim);
    padding: 2px 8px; border-radius: 20px; font-size: 11px; letter-spacing: 0;
  }
  .day-ev {
    display: flex; gap: 11px; padding: 11px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .day-ev:last-child { border-bottom: none; padding-bottom: 0; }
  .day-ev .bar { width: 3px; border-radius: 3px; flex-shrink: 0; background: var(--evc); }
  .day-ev .body { flex: 1; min-width: 0; }
  .day-ev .t { font-size: 13.5px; font-weight: 500; margin-bottom: 3px; }
  .day-ev .meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 8px; align-items: center; }
  .day-ev .meta .tag {
    font-size: 10.5px; padding: 1px 7px; border-radius: 5px;
    background: var(--evbg); color: var(--evc); font-weight: 600;
  }
  .day-ev .money { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .day-ev .money.in { color: var(--ev-prod); }
  .day-ev .money.out { color: var(--ev-pay); }
  .empty { color: var(--text-faint); font-size: 13px; text-align: center; padding: 20px 0; }

  .add-btn {
    width: 100%; padding: 11px; border-radius: var(--radius-sm);
    border: 1px dashed var(--border); background: transparent;
    color: var(--text-dim); cursor: pointer; font-size: 13px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .add-btn:hover { border-color: var(--violet); color: var(--violet-dim); background: var(--violet-soft); }

  .kpi-row { display: flex; gap: 10px; }
  .kpi {
    flex: 1; background: var(--bg); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 12px;
  }
  .kpi .label { font-size: 11px; color: var(--text-faint); margin-bottom: 5px; }
  .kpi .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .val.out { color: var(--ev-pay); }
  .kpi .val.in { color: var(--ev-prod); }
</style>
</head>
<body>

  <aside class="sidebar">

<script>
const TYPES = {
  sale:    { label: 'Facturación',  color: 'var(--ev-sale)',   bg: 'rgba(109,92,245,.16)' },
  collect: { label: 'Cobros',       color: 'var(--ev-collect)',bg: 'rgba(245,166,35,.14)' },
  pay:     { label: 'Pagos',        color: 'var(--ev-pay)',    bg: 'rgba(239,90,111,.14)' },
  tax:     { label: 'Impuestos',    color: 'var(--ev-tax)',    bg: 'rgba(224,69,123,.14)' },
  prod:    { label: 'Producción',   color: 'var(--ev-prod)',   bg: 'rgba(34,197,139,.14)' },
  cash:    { label: 'Caja',         color: 'var(--ev-cash)',   bg: 'rgba(59,176,224,.14)' },
  custom:  { label: 'Propios',      color: 'var(--ev-custom)', bg: 'rgba(138,138,154,.14)' },
};

// Eventos derivados de los módulos del ERP + propios. (mes: sep 2026)
let EVENTS = [
  { d: '2026-09-02', type: 'tax',     title: 'Vto. IVA — DDJJ mensual', amount: null, flow: 'out', ref: 'F.931' },
  { d: '2026-09-03', type: 'collect', title: 'Panadería La Espiga', amount: 184500, flow: 'in', ref: 'FC-A 0001-00234' },
  { d: '2026-09-05', type: 'prod',    title: 'OP-0042 · Pantallas LED', amount: null, flow: null, ref: 'entrega estimada' },
  { d: '2026-09-05', type: 'pay',     title: 'Distribuidora Sur S.A.', amount: 92300, flow: 'out', ref: 'OC-0088' },
  { d: '2026-09-08', type: 'sale',    title: 'Factura recurrente · Estudio Ríos', amount: 45000, flow: 'in', ref: 'suscripción' },
  { d: '2026-09-08', type: 'collect', title: 'Recordatorio cobro · Kiosco 24', amount: 31200, flow: 'in', ref: '2º aviso' },
  { d: '2026-09-10', type: 'cash',    title: 'Cierre de turno · Caja Mostrador', amount: null, flow: null, ref: 'arqueo' },
  { d: '2026-09-12', type: 'tax',     title: 'Vto. IIBB — Convenio Multilateral', amount: null, flow: 'out', ref: 'CM03' },
  { d: '2026-09-12', type: 'pay',     title: 'Insumos Panadería SRL', amount: 156800, flow: 'out', ref: 'OC-0091' },
  { d: '2026-09-15', type: 'collect', title: 'Electro Mayorista', amount: 540000, flow: 'in', ref: 'FC-A 0001-00251 · vencida' },
  { d: '2026-09-16', type: 'collect', title: 'Panadería La Espiga', amount: 98000, flow: 'in', ref: 'FC-A 0001-00260' },
  { d: '2026-09-16', type: 'prod',    title: 'OP-0043 · Cartelería vial', amount: null, flow: null, ref: 'inicio' },
  { d: '2026-09-16', type: 'custom',  title: 'Reunión con contador externo', amount: null, flow: null, ref: '15:00 hs' },
  { d: '2026-09-16', type: 'pay',     title: 'Servicios · Edenor', amount: 43700, flow: 'out', ref: 'factura' },
  { d: '2026-09-18', type: 'sale',    title: 'Factura recurrente · Comercios AR', amount: 78000, flow: 'in', ref: 'suscripción' },
  { d: '2026-09-19', type: 'prod',    title: 'OP-0042 · Pantallas LED', amount: null, flow: null, ref: 'entrega final' },
  { d: '2026-09-20', type: 'tax',     title: 'Vto. Retenciones — SICORE', amount: null, flow: 'out', ref: 'presentación' },
  { d: '2026-09-22', type: 'collect', title: 'Kiosco 24', amount: 31200, flow: 'in', ref: 'FC-B · vence hoy' },
  { d: '2026-09-24', type: 'pay',     title: 'Distribuidora Sur S.A.', amount: 210000, flow: 'out', ref: 'OC-0095' },
  { d: '2026-09-25', type: 'custom',  title: 'Cierre contable del mes', amount: null, flow: null, ref: 'checklist' },
  { d: '2026-09-26', type: 'collect', title: 'Electro Mayorista', amount: 120000, flow: 'in', ref: 'plan de pago 2/3' },
  { d: '2026-09-29', type: 'cash',    title: 'Cierre de turno · Caja 2', amount: null, flow: null, ref: 'arqueo' },
  { d: '2026-09-30', type: 'tax',     title: 'Vto. IVA — DDJJ mensual', amount: null, flow: 'out', ref: 'F.2002' },
  { d: '2026-09-30', type: 'sale',    title: 'Cierre facturación mensual', amount: null, flow: null, ref: 'resumen' },
];

const activeFilters = new Set(Object.keys(TYPES));
let viewYear = 2026, viewMonth = 8; // sep (0-idx)
const TODAY = '2026-09-16';
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const fmt = n => n == null ? '' : '$' + n.toLocaleString('es-AR');

function renderFilters() {
  const c = document.getElementById('filters');
  c.innerHTML = '';
  for (const [k, t] of Object.entries(TYPES)) {
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (activeFilters.has(k) ? '' : ' off');
    chip.innerHTML = `<span class="dot" style="background:${t.color}"></span>${t.label}`;
    chip.onclick = () => { activeFilters.has(k) ? activeFilters.delete(k) : activeFilters.add(k); renderFilters(); renderCalendar(); };
    c.appendChild(chip);
  }
}

function evForDay(dateStr) {
  return EVENTS.filter(e => e.d === dateStr && activeFilters.has(e.type));
}

function renderCalendar() {
  document.getElementById('monthLabel').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
  const body = document.getElementById('calBody');
  body.innerHTML = '';
  const first = new Date(viewYear, viewMonth, 1);
  let startDow = (first.getDay() + 6) % 7; // lunes = 0
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();
  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push({ day: prevDays - i, other: true, m: viewMonth - 1 });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, other: false, m: viewMonth });
  while (cells.length % 7 !== 0) cells.push({ day: cells.length - (startDow + daysInMonth) + 1, other: true, m: viewMonth + 1 });

  cells.forEach(c => {
    let y = viewYear, m = c.m;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (c.other ? ' other' : '') + (ds === TODAY ? ' today' : '');
    cell.innerHTML = `<div class="daynum">${c.day}</div>`;
    if (!c.other) {
      const evs = evForDay(ds);
      evs.slice(0, 3).forEach(e => {
        const t = TYPES[e.type];
        const el = document.createElement('div');
        el.className = 'ev';
        el.style.setProperty('--evc', t.color);
        el.style.setProperty('--evbg', t.bg);
        el.innerHTML = `<span>${e.title}</span>${e.amount ? `<span class="amt">${fmt(e.amount)}</span>` : ''}`;
        cell.appendChild(el);
      });
      if (evs.length > 3) {
        const more = document.createElement('div');
        more.className = 'ev-more';
        more.textContent = `+${evs.length - 3} más`;
        cell.appendChild(more);
      }
      cell.onclick = () => renderDay(ds);
    }
    body.appendChild(cell);
  });
}

function renderDay(ds) {
  const [y,m,d] = ds.split('-').map(Number);
  const evs = evForDay(ds);
  document.getElementById('dayTitle').childNodes[0].textContent =
    (ds === TODAY ? 'Hoy, ' : '') + `${d} ${MONTHS[m-1].slice(0,3).toLowerCase()} `;
  document.getElementById('dayCount').textContent = evs.length;
  const list = document.getElementById('dayList');
  list.innerHTML = '';
  let totIn = 0, totOut = 0;
  if (evs.length === 0) {
    list.innerHTML = '<div class="empty">Nada agendado este día.</div>';
  } else {
    evs.forEach(e => {
      const t = TYPES[e.type];
      if (e.amount && e.flow === 'in') totIn += e.amount;
      if (e.amount && e.flow === 'out') totOut += e.amount;
      const row = document.createElement('div');
      row.className = 'day-ev';
      row.style.setProperty('--evc', t.color);
      row.style.setProperty('--evbg', t.bg);
      row.innerHTML = `
        <div class="bar"></div>
        <div class="body">
          <div class="t">${e.title}</div>
          <div class="meta"><span class="tag">${t.label}</span> ${e.ref || ''}</div>
        </div>
        ${e.amount ? `<div class="money ${e.flow === 'in' ? 'in' : 'out'}">${e.flow==='in'?'+':'−'}${fmt(e.amount)}</div>` : ''}
      `;
      list.appendChild(row);
    });
  }
  document.getElementById('kpiIn').textContent = fmt(totIn) || '$0';
  document.getElementById('kpiOut').textContent = fmt(totOut) || '$0';
}

document.getElementById('prev').onclick = () => { viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderCalendar(); };
document.getElementById('next').onclick = () => { viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderCalendar(); };
document.getElementById('todayBtn').onclick = () => { viewYear=2026; viewMonth=8; renderCalendar(); renderDay(TODAY); };
document.getElementById('addBtn').onclick = () => {
  const title = prompt('Título del evento propio:');
  if (!title) return;
  EVENTS.push({ d: TODAY, type: 'custom', title, amount: null, flow: null, ref: 'manual' });
  renderCalendar(); renderDay(TODAY);
};

renderFilters();
renderCalendar();
renderDay(TODAY);
</script>
